<svg width="800" height="150" viewBox="0 0 800 150" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Stack technique">
  <style>
    text{font-family:"JetBrains Mono","Courier New",monospace;fill:#a89984}
    .title{font-size:13px;font-weight:700;letter-spacing:3px;fill:#fabd2f}
    .lbl{font-size:11px;text-anchor:middle}
    .ic{font-size:14px;font-weight:800;fill:#282828;text-anchor:middle}
  </style>
  <rect x="4" y="4" width="792" height="142" rx="22" fill="#282828" stroke="#fe8019" stroke-width="6"/>
  <text class="title" x="26" y="34">## STACK</text>

  <!-- 6 tuiles : x = 26,154,282,410,538,666 (width 108, gap 20) -->
  <g>
    <g>
      <rect x="26"  y="52" width="108" height="72" rx="12" fill="#32302f" stroke="#665c54" stroke-width="1"/>
      <rect x="52"  y="66" width="28" height="28" rx="8" fill="#fe8019"/><text class="ic" x="66"  y="86">C</text><text class="lbl" x="80"  y="112">C</text>
    </g>
    <g>
      <rect x="154" y="52" width="108" height="72" rx="12" fill="#32302f" stroke="#665c54" stroke-width="1"/>
      <rect x="180" y="66" width="28" height="28" rx="8" fill="#8ec07c"/><text class="ic" x="194" y="86">C+</text><text class="lbl" x="208" y="112">C++</text>
    </g>
    <g>
      <rect x="282" y="52" width="108" height="72" rx="12" fill="#32302f" stroke="#665c54" stroke-width="1"/>
      <rect x="308" y="66" width="28" height="28" rx="8" fill="#fabd2f"/><text class="ic" x="322" y="86">Py</text><text class="lbl" x="336" y="112">Python</text>
    </g>
    <g>
      <rect x="410" y="52" width="108" height="72" rx="12" fill="#32302f" stroke="#665c54" stroke-width="1"/>
      <rect x="436" y="66" width="28" height="28" rx="8" fill="#83a598"/><text class="ic" x="450" y="86">TS</text><text class="lbl" x="464" y="112">TypeScript</text>
    </g>
    <g>
      <rect x="538" y="52" width="108" height="72" rx="12" fill="#32302f" stroke="#665c54" stroke-width="1"/>
      <rect x="564" y="66" width="28" height="28" rx="8" fill="#b8bb26"/><text class="ic" x="578" y="86">Do</text><text class="lbl" x="592" y="112">Docker</text>
    </g>
    <g>
      <rect x="666" y="52" width="108" height="72" rx="12" fill="#32302f" stroke="#665c54" stroke-width="1"/>
      <rect x="692" y="66" width="28" height="28" rx="8" fill="#d3869b"/><text class="ic" x="706" y="86">K8s</text><text class="lbl" x="720" y="112">Kubernetes</text>
    </g>
