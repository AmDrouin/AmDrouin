    <rect x="346" y="60" width="90"  height="34" rx="6" fill="#32302f" stroke="#665c54"/><text class="pill" x="391" y="82">Makefile</text>
    <rect x="446" y="60" width="64"  height="34" rx="6" fill="#32302f" stroke="#665c54"/><text class="pill" x="478" y="82">Bash</text>
    <rect x="520" y="60" width="60"  height="34" rx="6" fill="#32302f" stroke="#665c54"/><text class="pill" x="550" y="82">CSS</text>
