<svg width="800" height="150" viewBox="0 0 800 150" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Bannière de profil">
  <style>
    text{font-family:"JetBrains Mono","Courier New",monospace}
    .handle{font-size:13px;font-weight:700;letter-spacing:2px;fill:#fabd2f}
    .name{font-size:34px;font-weight:800;fill:#ebdbb2}
    .tag{font-size:14px;fill:#fe8019}
    .cursor{animation:blink 1.1s step-end infinite}
    @keyframes blink{50%{opacity:0}}
    @media (prefers-reduced-motion:reduce){.cursor{animation:none}}
  </style>

  <rect x="0" y="0" width="800" height="150" rx="14" fill="#282828" stroke="#fe8019" stroke-width="1.5"/>

  <!-- barre de fenêtre terminal -->
  <circle cx="30" cy="26" r="5" fill="#fb4934"/>
  <circle cx="48" cy="26" r="5" fill="#fabd2f"/>
  <circle cx="66" cy="26" r="5" fill="#b8bb26"/>

  <!-- texte -->
  <text class="handle" x="26" y="66">$ whoami — @AmDrouin</text>
  <text class="name" x="24" y="102">AmDrouin</text>
  <text class="tag" x="26" y="128">~/building --with typescript<tspan class="cursor" dx="4">▌</tspan></text>
</svg>
