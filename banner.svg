<svg width="800" height="230" viewBox="0 0 800 230" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Bannière de profil">
  <style>
    text{font-family:"JetBrains Mono","Courier New",monospace}
    .handle{font-size:13px;font-weight:700;letter-spacing:2px;fill:#fabd2f}
    .name{font-size:44px;font-weight:800;fill:#ebdbb2}
    .tag{font-size:15px;fill:#fe8019}
    .init{font-size:32px;font-weight:800;fill:#282828}
    .cursor{animation:blink 1.1s step-end infinite}
    @keyframes blink{50%{opacity:0}}
    @media (prefers-reduced-motion:reduce){.cursor{animation:none}}
  </style>
  <defs>
    <linearGradient id="av" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fabd2f"/><stop offset="1" stop-color="#d65d0e"/>
    </linearGradient>
    <clipPath id="ac"><circle cx="97" cy="107" r="52"/></clipPath>
  </defs>

  <rect x="0" y="0" width="800" height="230" rx="12" fill="#1d2021"/>
  <rect x="16" y="16" width="768" height="198" rx="14" fill="#282828" stroke="#504945" stroke-width="1.5"/>

  <!-- barre de fenêtre terminal -->
  <circle cx="44" cy="40" r="5" fill="#fb4934"/>
  <circle cx="62" cy="40" r="5" fill="#fabd2f"/>
  <circle cx="80" cy="40" r="5" fill="#b8bb26"/>

  <!-- avatar -->
  <circle cx="97" cy="107" r="55" fill="none" stroke="#fabd2f" stroke-width="2.5"/>
  <circle cx="97" cy="107" r="52" fill="url(#av)"/>
  <!-- AVATAR_IMAGE : décommente + colle ton base64, puis supprime le <text class="init">
  <image clip-path="url(#ac)" x="45" y="55" width="104" height="104" href="data:image/jpeg;base64,COLLE_ICI" preserveAspectRatio="xMidYMid slice"/>
  -->
  <text class="init" x="97" y="119" text-anchor="middle">VP</text>

  <!-- texte -->
  <text class="handle" x="185" y="66">$ whoami — @AmDrouin</text>
  <text class="name" x="182" y="114">AmDrouin</text>
  <text class="tag" x="185" y="146">~/building --with typescript<tspan class="cursor" dx="4">▌</tspan></text>
</svg>
